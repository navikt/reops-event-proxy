name: "Deploy Test Kafka Topics"
run-name: "Deploy Test Kafka Topics @ ${{ github.ref_name }} — ${{ github.sha }}"

on:
  workflow_dispatch:

concurrency:
  group: deploy-kafka-test
  cancel-in-progress: false

jobs:
  deploy-kafka-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Deploy test topics to dev-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/topics/analytics-test.yaml
