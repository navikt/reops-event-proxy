name: "Deploy Test (Manual)"
run-name: "Deploy Test @ ${{ github.ref_name }} — ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build, including a PR's source branch in this repository"
        required: true
        type: string

concurrency:
  group: deploy-test-manual
  cancel-in-progress: false

jobs:
  build-test-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest-8-cores
    permissions:
      packages: write
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ inputs.branch }}
          persist-credentials: false
      - name: Build and push test image
        id: docker-build-push
        uses: nais/docker-build-push@v0
        with:
          team: team-researchops
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          image_suffix: test
          build_args: CI=true

  deploy-kafka-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Deploy analytics-test-raw to dev-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/topics/analytics-raw-test.yaml
      - name: Deploy analytics-test-clean to dev-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/topics/analytics-clean-test.yaml
      - name: Deploy analytics-test-enriched to dev-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/topics/analytics-enriched-test.yaml
      - name: Deploy analytics-test-website to dev-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/topics/analytics-website-test.yaml

  deploy-application-test:
    needs: [build-test-image, deploy-kafka-test]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Deploy event proxy to test
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/nais-test.yaml
          VAR: image=${{ needs.build-test-image.outputs.image }}
