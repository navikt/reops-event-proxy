apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: analytics-test-raw
  namespace: team-researchops
  labels:
    team: team-researchops
  annotations:
    kafka.nais.io/removeDataWhenResourceIsDeleted: "true"
spec:
  pool: nav-dev
  config:
    cleanupPolicy: delete
    minimumInSyncReplicas: 1
    partitions: 4
    retentionHours: 1
  acl:
    - team: team-researchops
      application: reops-event-proxy-test
      access: write
    - team: team-researchops
      application: reops-raw-to-clean-test
      access: read
---
